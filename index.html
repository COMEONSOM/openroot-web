<!doctype html>
<html lang="en">
<head>
  <!-- Theme: apply before React loads to prevent flash -->
  <script>
    (function () {
      try {
        var saved =
          localStorage.getItem("ot-theme-mode") ||
          localStorage.getItem("ot-theme");

        if (saved === "light" || saved === "dark") {
          document.documentElement.setAttribute("data-theme", saved);
        } else {
          document.documentElement.removeAttribute("data-theme");
        }
      } catch (e) {
        document.documentElement.removeAttribute("data-theme");
      }
    })();
  </script>
